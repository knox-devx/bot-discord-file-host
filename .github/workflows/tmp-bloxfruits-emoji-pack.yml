name: tmp-build-bloxfruits-emoji-pack

on:
  push:
    branches:
      - tmp-bloxfruits-emoji-pack-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Search global Fandom files for missing item icons
        run: |
          python - <<'PY'
          import requests
          API='https://blox-fruits.fandom.com/api.php'; S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 BloxEmojiPack/5.0'})
          terms=['Torch','Cup','Relic','Flower','Core Brain','Hellfire','Library Key','Water Key','Apple','Banana','Pineapple','Hallow Essence','Microchip','Fragments Elixir']
          for term in terms:
            try:
              r=S.get(API,params={'action':'query','format':'json','formatversion':'2','list':'allimages','aifrom':term,'ailimit':'50'},timeout=20);r.raise_for_status()
              vals=[x['name'] for x in r.json().get('query',{}).get('allimages',[]) if term.lower().replace(' ','') in x['name'].lower().replace(' ','')]
              print(term,'=>',vals[:30])
            except Exception as e: print(term,'ERR',repr(e))
          PY
