name: tmp-build-bloxfruits-emoji-pack

on:
  push:
    branches:
      - tmp-bloxfruits-emoji-pack-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Build pack
        run: python tools/tmp_fast_blox_pack.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blox-fruits-emoji-pack-completo
          path: build/Blox_Fruits_Emoji_Pack_COMPLETO.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
