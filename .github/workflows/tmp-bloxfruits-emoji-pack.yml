name: tmp-build-bloxfruits-emoji-pack

on:
  push:
    branches:
      - tmp-bloxfruits-emoji-pack-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect missing hotbar item assets
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          from urllib.parse import unquote
          API='https://blox-fruits.fandom.com/api.php'
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 BloxEmojiPack/4.0'})
          names=['Torch','Cup','Ancient Relic','Flowers','Core Brain','Hellfire Torch','Library Key','Water Key','Apple','Banana','Pineapple','Hallow Essence','Special Microchip','Fragments Elixir']
          def api(p):
              p={'format':'json','formatversion':'2',**p};r=S.get(API,params=p,timeout=20);r.raise_for_status();return r.json()
          for name in names:
              print('\n===',name,'===')
              d=api({'action':'query','prop':'images','titles':name,'imlimit':'max'})
              pages=d.get('query',{}).get('pages',[])
              print('QUERY_IMAGES:', [x['title'] for x in (pages[0].get('images',[]) if pages else [])])
              try:
                  d=api({'action':'parse','page':name,'prop':'text'})
                  soup=BeautifulSoup(d.get('parse',{}).get('text',''),'html.parser')
                  vals=[]
                  for im in soup.find_all('img'):
                      v=im.get('data-image-name') or im.get('data-image-key') or im.get('alt')
                      if v: vals.append(v)
                  print('PARSE_IMAGES:', list(dict.fromkeys(vals))[:80])
              except Exception as e: print('PARSE_ERR',repr(e))
          PY
