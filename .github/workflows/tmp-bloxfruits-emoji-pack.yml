name: tmp-build-bloxfruits-emoji-pack

on:
  push:
    branches:
      - tmp-bloxfruits-emoji-pack-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Test image sources
        run: |
          python - <<'PY'
          import requests
          urls = [
            'https://blox-fruits.fandom.com/api.php?action=query&format=json&titles=Rocket&prop=images&imlimit=20',
            'https://static.wikia.nocookie.net/roblox-blox-piece/images/c/cb/Rocket_Fruit.png/revision/latest?cb=20231027120039',
            'https://blox-fruits.fandom.com/wiki/Swords',
            'https://bloxfruitswiki.org/wiki/swords/',
          ]
          for u in urls:
            try:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 BloxEmojiPack/1.0'},timeout=15)
              print('URL',u,'STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
              print(r.text[:300] if 'json' in (r.headers.get('content-type') or '') or 'text' in (r.headers.get('content-type') or '') else 'BINARY')
            except Exception as e: print('ERROR',u,repr(e))
          PY
