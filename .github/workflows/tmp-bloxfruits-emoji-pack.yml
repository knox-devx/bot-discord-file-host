name: tmp-build-bloxfruits-emoji-pack

on:
  push:
    branches:
      - tmp-bloxfruits-emoji-pack-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Apply live-list corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/tmp_build_blox_pack.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"Flame", "Falcon",', '"Flame",')
          s = s.replace('"Portal", "Rumble",', '"Portal", "Lightning",')
          s = s.replace('"Control", "Dragon", "Meme", "Meme (Admin)"', '"Control", "Dragon"')
          s = s.replace('for attempt in range(4):', 'for attempt in range(2):')
          s = s.replace('SESSION.get(url, timeout=30)', 'SESSION.get(url, timeout=12)')
          p.write_text(s, encoding='utf-8')

      - name: Build pack
        run: python tools/tmp_build_blox_pack.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blox-fruits-emoji-pack-completo
          path: build/Blox_Fruits_Emoji_Pack_COMPLETO.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
